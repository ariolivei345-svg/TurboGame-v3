name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Aceitar licencas e instalar SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar
        run: |
          Z=$(ls projeto_corrigido_v3*.zip 2>/dev/null | head -1)
          if [ -z "$Z" ]; then echo "ERRO: envie o projeto_corrigido_v3.zip"; exit 1; fi
          rm -rf projeto && mkdir projeto
          unzip -q "$Z" -d projeto
          cd projeto
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TurboGame-apk
          path: "projeto/app/build/outputs/apk/debug/*.apk"
